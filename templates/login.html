<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | DDoS Analyzer</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- Font Awesome 6.4 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <!-- JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="login-page">

  <!-- ───────── Ambient background glows ───────── -->
  <div class="login-bg">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <!-- ───────── Login card ───────── -->
  <div class="login-card">

    <!-- Logo / heading -->
    <div class="login-logo">
      <div class="logo-icon">
        <i class="fas fa-shield-virus"></i>
      </div>
      <h2>DDoS Analyzer</h2>
      <p>AI-Based Attack Classification</p>
    </div>

    <!-- Flash error message (rendered by Flask) -->
    {% if error %}
    <div class="login-error">
      <i class="fas fa-exclamation-circle"></i>
      {{ error }}
    </div>
    {% endif %}

    <!-- Login form -->
    <form class="login-form" method="POST" action="/login">
      <!-- CSRF token should be added here when Flask-WTF is integrated -->
      {# CSRF: add Flask-WTF hidden_tag() here when flask-wtf is installed #}

      <!-- Username -->
      <div class="form-group-cy">
        <label class="cy-label" for="username">Username</label>
        <div class="cy-input-wrap">
          <i class="fas fa-user input-icon"></i>
          <input
            class="cy-input"
            id="username"
            type="text"
            name="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <!-- Password -->
      <div class="form-group-cy">
        <label class="cy-label" for="passwordInput">Password</label>
        <div class="cy-input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input
            class="cy-input"
            id="passwordInput"
            type="password"
            name="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
          <i class="fas fa-eye input-icon-right" id="togglePwd" title="Toggle visibility"></i>
        </div>
      </div>

      <!-- Remember me + Forgot password -->
      <div class="remember-row">
        <label class="cy-checkbox">
          <input type="checkbox" name="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button class="login-btn" type="submit">
        <i class="fas fa-sign-in-alt"></i>
        Access Dashboard
      </button>
    </form>

    <!-- Demo credentials hint -->
    <p class="login-footer-text">
      Demo credentials: <a href="#">admin / ddos@admin</a>
    </p>

    <!-- Security notice -->
    <div class="login-security-notice">
      <i class="fas fa-lock"></i>
      Secure connection &bull; Session encrypted &bull; Authorized access only
    </div>

  </div><!-- /login-card -->

  <!-- Bootstrap 5 JS (needed for any future modal/tooltip use) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Password visibility toggle -->
  <script>
    (function () {
      const toggleBtn   = document.getElementById('togglePwd');
      const passwordInput = document.getElementById('passwordInput');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function () {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleBtn.classList.toggle('fa-eye',        !isPassword);
          toggleBtn.classList.toggle('fa-eye-slash',   isPassword);
        });
      }
    })();
  </script>

</body>
</html>
